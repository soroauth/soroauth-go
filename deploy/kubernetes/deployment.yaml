apiVersion: apps/v1
kind: Deployment
metadata:
  name: soroauth-verification
  namespace: soroauth
  labels:
    app.kubernetes.io/name: soroauth-verification
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: soroauth-verification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soroauth-verification
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/soroauth/soroauth-go:latest
          # The image publishes the CLI as its entrypoint and the server beside
          # it; a deployment selects the server explicitly.
          command: ["/usr/local/bin/soroauth-server"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            # Non-loopback by design; loadConfig requires AUTH_TOKEN for this
            # bind and refuses to start without it.
            - name: ADDR
              value: ":8080"
            - name: METRICS_ADDR
              value: ":9090"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: soroauth-auth
                  key: auth-token
          envFrom:
            - configMapRef:
                name: soroauth-verification
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
