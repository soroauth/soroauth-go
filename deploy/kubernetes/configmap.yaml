apiVersion: v1
kind: ConfigMap
metadata:
  name: soroauth-verification
  namespace: soroauth
  labels:
    app.kubernetes.io/name: soroauth-verification
data:
  READ_TIMEOUT: "5s"
  READ_HEADER_TIMEOUT: "5s"
  WRITE_TIMEOUT: "10s"
  IDLE_TIMEOUT: "120s"
  MAX_BODY_BYTES: "1048576"
  MAX_CONCURRENT_REQUESTS: "64"
  RATE_LIMIT_PER_SECOND: "50"
  RATE_LIMIT_BURST: "100"
