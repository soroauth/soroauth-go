apiVersion: v1
kind: Service
metadata:
  name: soroauth-verification
  namespace: soroauth
  labels:
    app.kubernetes.io/name: soroauth-verification
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: soroauth-verification
---
apiVersion: v1
kind: Service
metadata:
  name: soroauth-verification-metrics
  namespace: soroauth
  labels:
    app.kubernetes.io/name: soroauth-verification
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
  selector:
    app.kubernetes.io/name: soroauth-verification
