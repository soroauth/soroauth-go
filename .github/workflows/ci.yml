name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage above floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: run tests with coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          echo "=== Coverage report ==="
          go tool cover -func=coverage.out
      - name: check coverage floor
        run: |
          floor=80
          total=$(go tool cover -func=coverage.out | awk '/total/{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if python3 -c "import sys; sys.exit(0 if float('${total}') < float('${floor}') else 1)"; then
            echo "Coverage ${total}% is below the floor of ${floor}%"
            exit 1
          fi
      - name: publish coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  build:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      # -race because internal/xdrcopy shares encoder/decoder buffers across
      # calls through sync.Pool: TestCopyConcurrentReuse only proves the
      # no-aliasing guarantee holds under concurrency if something is actually
      # watching for concurrent misuse.
      - name: test
        run: go test -race ./...

  # The wallet SDK adapter is a nested module, so the gofmt, vet and test steps
  # above do not reach it: `./...` stops at any directory holding its own
  # go.mod. It is checked here instead. Without this job the adapter would be
  # unbuilt and untested in CI, which is the gap a nested module invites.
  adapter:
    name: wallet sdk adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: adapters/walletsdk/go.sum
      - name: gofmt
        working-directory: adapters/walletsdk
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        working-directory: adapters/walletsdk
        run: go vet ./...
      # -race for the same reason as the root test job: the adapter verifies its
      # own signatures, and the test suite is what says the signed bytes are a
      # real ed25519 signature rather than a shape it agrees with itself about.
      - name: test
        working-directory: adapters/walletsdk
        run: go test -race ./...
  cross-compile:
    name: cross-compile release targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          binary_name=soroauth
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary_name=soroauth.exe
          fi
          go build -ldflags="-s -w" -o "${binary_name}" ./cmd/soroauth
          # Smoke test: run --help to verify the binary runs (only for native platform)
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            ./${binary_name} help >/dev/null
          fi
        timeout-minutes: 5

  golden-drift:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # @stellar/stellar-sdk@17.1.0 declares engines node >=22.12.0.
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json

      # npm ci installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree, so the reference build cannot
      # drift without this step noticing.
      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci

      - name: regenerate the vectors
        working-directory: testdata/gen
        run: node gen.mjs

      # The vectors are generated, committed artefacts. If regenerating them
      # changes anything, then either someone edited a vector by hand or the
      # reference implementation moved, and in both cases the committed
      # evidence no longer says what it claims to.
      - name: fail if the committed vectors changed
        run: |
          if ! git diff --exit-code testdata/vectors; then
            echo
            echo "The committed golden vectors differ from freshly generated ones."
            echo "Vectors are never edited by hand. Regenerate them with:"
            echo "  cd testdata/gen && npm ci && node gen.mjs"
            echo "and commit the result, or investigate why the reference output moved."
            exit 1
          fi

  bench:
    name: signing-path budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      # ns/op is deliberately not gated: wall-clock on a shared runner is too
      # noisy to be evidence. allocs/op and B/op are deterministic and are
      # compared against testdata/bench/budgets.json.
      - name: run signing-path benchmarks
        run: go test -run '^$' -bench . -benchmem -count=1 . | tee bench.out
      - name: fail on allocation or byte regression
        run: go run ./scripts/checkbench bench.out testdata/bench/budgets.json
