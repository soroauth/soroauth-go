name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Which advisory jobs need to run for this change.
  #
  # The two jobs the branch ruleset requires — "vet and test" and "golden
  # vectors are reproducible" — deliberately do NOT depend on this and are never
  # filtered. A required check that is skipped never reports a conclusion, and
  # the pull request would then be unmergeable forever. Everything else is
  # advisory and is safe to skip.
  changes:
    name: decide which jobs to run
    runs-on: ubuntu-latest
    outputs:
      go_any: ${{ steps.filter.outputs.go_any }}
      go_root: ${{ steps.filter.outputs.go_root }}
      walletsdk: ${{ steps.filter.outputs.walletsdk }}
      gcpkms: ${{ steps.filter.outputs.gcpkms }}
      vectors: ${{ steps.filter.outputs.vectors }}
      parity_python: ${{ steps.filter.outputs.parity_python }}
      parity_rust: ${{ steps.filter.outputs.parity_rust }}
      wasm: ${{ steps.filter.outputs.wasm }}
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        name: classify changed files
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # On a push to main every advisory job runs. main is the branch that
          # has to stay green, so it is never filtered.
          if [ "$EVENT" != "pull_request" ]; then
            for k in go_any go_root walletsdk gcpkms vectors parity_python parity_rust wasm bench; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            echo "not a pull request: running every advisory job"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          matches() { echo "$changed" | grep -qE "$1"; }
          emit() {
            if matches "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; echo "  -> $1"
            else echo "$1=false" >> "$GITHUB_OUTPUT"; fi
          }

          echo "jobs selected:"
          # Any Go anywhere, or the module definition.
          emit go_any        '(\.go$|^go\.(mod|sum)$)'
          # The library itself: Go at the repo root, which everything depends on.
          emit go_root       '(^[^/]+\.go$|^go\.(mod|sum)$|^internal/)'
          emit walletsdk     '^adapters/walletsdk/'
          emit gcpkms        '^adapters/gcpkms/'
          emit vectors       '^testdata/(vectors|gen)/'
          emit parity_python '^testdata/parity-python/'
          emit parity_rust   '^testdata/parity-rust/'
          emit wasm          '^wasm/'
          emit bench         '^testdata/bench/'
  coverage:
    name: coverage above floor
    needs: changes
    if: needs.changes.outputs.go_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: run tests with coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          echo "=== Coverage report ==="
          go tool cover -func=coverage.out
      - name: check coverage floor
        run: |
          # 60 is a floor set below a measured total, not an aspiration. The
          # 80 this replaced never passed: every push to main since the floor
          # was added reported ~62% and failed (run 36087884030 printed
          # "Total coverage: 62.1% is below the floor of 80%").
          # Measured 2026-09-25 with go1.25.4 on linux/amd64:
          #   go test -coverprofile=coverage.out -covermode=atomic ./...
          #   go tool cover -func=coverage.out | tail -1  ->  total: 62.8%
          # Raise this as tests are added; never lower it without a fresh
          # measurement named in the commit body.
          floor=60
          total=$(go tool cover -func=coverage.out | awk '/total/{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if python3 -c "import sys; sys.exit(0 if float('${total}') < float('${floor}') else 1)"; then
            echo "Coverage ${total}% is below the floor of ${floor}%"
            exit 1
          fi
      - name: publish coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  build:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      # -race because internal/xdrcopy shares encoder/decoder buffers across
      # calls through sync.Pool: TestCopyConcurrentReuse only proves the
      # no-aliasing guarantee holds under concurrency if something is actually
      # watching for concurrent misuse.
      - name: test
        run: go test -race ./...

  # The wallet SDK adapter is a nested module, so the gofmt, vet and test steps
  # above do not reach it: `./...` stops at any directory holding its own
  # go.mod. It is checked here instead. Without this job the adapter would be
  # unbuilt and untested in CI, which is the gap a nested module invites.
  adapter:
    name: wallet sdk adapter
    needs: changes
    if: needs.changes.outputs.go_root == 'true' || needs.changes.outputs.walletsdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: adapters/walletsdk/go.sum
      - name: gofmt
        working-directory: adapters/walletsdk
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        working-directory: adapters/walletsdk
        run: go vet ./...
      # -race for the same reason as the root test job: the adapter verifies its
      # own signatures, and the test suite is what says the signed bytes are a
      # real ed25519 signature rather than a shape it agrees with itself about.
      - name: test
        working-directory: adapters/walletsdk
        run: go test -race ./...
  # The GCP KMS adapter is a nested module too, for the same reason: it names a
  # cloud SDK the root module must not pull in. Its tests use a fake KMS client,
  # so the job needs no credentials and never touches live GCP.
  gcpkms:
    name: gcp kms adapter
    needs: changes
    if: needs.changes.outputs.go_root == 'true' || needs.changes.outputs.gcpkms == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: adapters/gcpkms/go.sum
      - name: gofmt
        working-directory: adapters/gcpkms
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        working-directory: adapters/gcpkms
        run: go vet ./...
      # -race because the signer verifies its own output; the test suite is what
      # says the signed bytes are a real ed25519 signature, not a shape the code
      # agrees with itself about.
      - name: test
        working-directory: adapters/gcpkms
        run: go test -race ./...
  cross-compile:
    name: cross-compile release targets
    needs: changes
    if: needs.changes.outputs.go_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      # One job building every release target, rather than a matrix. A matrix
      # reports one check per target, which turned a contributor's pull request
      # into ten checks for six jobs and buried the two that actually gate the
      # merge. Building five targets takes seconds; the toolchain setup is what
      # costs, and this pays it once.
      - name: build every release target
        run: |
          set -euo pipefail
          failed=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            echo "::group::$goos/$goarch"
            if GOOS="$goos" GOARCH="$goarch" go build ./... ; then
              echo "ok $goos/$goarch"
            else
              echo "::error::build failed for $goos/$goarch"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
  golden-drift:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # @stellar/stellar-sdk@17.1.0 declares engines node >=22.12.0.
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json

      # npm ci installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree, so the reference build cannot
      # drift without this step noticing.
      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci

      - name: regenerate the vectors
        working-directory: testdata/gen
        run: node gen.mjs

      # The vectors are generated, committed artefacts. If regenerating them
      # changes anything, then either someone edited a vector by hand or the
      # reference implementation moved, and in both cases the committed
      # evidence no longer says what it claims to.
      - name: fail if the committed vectors changed
        run: |
          if ! git diff --exit-code testdata/vectors; then
            echo
            echo "The committed golden vectors differ from freshly generated ones."
            echo "Vectors are never edited by hand. Regenerate them with:"
            echo "  cd testdata/gen && npm ci && node gen.mjs"
            echo "and commit the result, or investigate why the reference output moved."
            exit 1
          fi

  python-parity:
    name: python sdk parity
    needs: changes
    if: needs.changes.outputs.go_root == 'true' || needs.changes.outputs.vectors == 'true' || needs.changes.outputs.parity_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The runner's system python is used on purpose: the harness pins the one
      # dependency it needs in requirements.txt, and pulling in a toolchain
      # action would be one more thing to keep pinned for no benefit.
      - name: install the pinned reference sdk and run the parity harness
        run: |
          python3 -m venv .venv-parity
          . .venv-parity/bin/activate
          pip install -r testdata/parity-python/requirements.txt
          python3 testdata/parity-python/parity.py
          python3 testdata/parity-python/test_parity.py

  rust-parity:
    name: rust xdr parity
    needs: changes
    if: needs.changes.outputs.go_root == 'true' || needs.changes.outputs.vectors == 'true' || needs.changes.outputs.parity_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The runner's preinstalled rustup is used on purpose: rust-toolchain.toml
      # pins the exact toolchain (1.93.0), so no toolchain action needs a SHA
      # pin of its own.
      - name: run the parity harness and its tests
        working-directory: testdata/parity-rust
        # --locked makes the committed Cargo.lock authoritative: the job fails
        # rather than silently re-resolving to a different stellar-xdr.
        run: |
          cargo test --locked
          cargo run --locked --bin parity

  wasm:
    name: wasm signing core and typescript wrapper
    needs: changes
    if: needs.changes.outputs.go_root == 'true' || needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wasm/ts/package-lock.json
      # The core builds only for js/wasm, so `go build ./...` on the host skips
      # it. This job is the only place it is compiled, which is why the build is
      # a step of its own rather than folded into `go test`.
      - name: build the wasm module
        run: ./wasm/build.sh
      - name: wasm byte parity against the golden vectors
        run: node wasm/parity.mjs
      - name: typescript wrapper
        working-directory: wasm/ts
        run: |
          npm ci
          npm run typecheck
          npm test

  bench:
    name: signing-path budgets
    needs: changes
    if: needs.changes.outputs.go_root == 'true' || needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      # ns/op is deliberately not gated: wall-clock on a shared runner is too
      # noisy to be evidence. allocs/op and B/op are deterministic and are
      # compared against testdata/bench/budgets.json.
      - name: run signing-path benchmarks
        run: go test -run '^$' -bench . -benchmem -count=1 . | tee bench.out
      - name: fail on allocation or byte regression
        run: go run ./scripts/checkbench bench.out testdata/bench/budgets.json
