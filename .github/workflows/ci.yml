# The two checks the branch ruleset requires.
#
# Never filtered by path. A required check that is skipped reports no
# conclusion, and the pull request can then never be merged.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go . node package-lock.json
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      # The e2e files sit behind a build tag, so `go vet ./...` never
      # compiles them. Two breakages reached main through that gap: a
      # deploy helper calling a txnbuild function that does not exist, and
      # a test using the soroauth package without importing it. Vetting the
      # tag costs no extra check and closes it.
      - name: vet (e2e build tag)
        run: go vet -tags e2e ./...
      # -race because internal/xdrcopy shares encoder/decoder buffers across
      # calls through sync.Pool: TestCopyConcurrentReuse only proves the
      # no-aliasing guarantee holds under concurrency if something is actually
      # watching for concurrent misuse.
      # The seed corpus is generated from the golden vectors, so it can drift
      # the same way they can. Regenerating and diffing costs a second and is a
      # step of this job rather than a job of its own, because pull requests are
      # capped at five checks. The seeds themselves are exercised by the
      # `go test` below: Go runs every file in
      # testdata/fuzz/FuzzValidateDelegateOrder as a normal subtest. The same
      # run writes the native expectations wasm/parity.mjs replays the wasm
      # build against, so those are covered by the same diff.
      - name: fuzz seed corpus is reproducible
        run: |
          go run ./cmd/gencorpus
          if ! git diff --exit-code testdata/fuzz testdata/wasm-parity; then
            echo
            echo "The committed fuzz seed corpus or wasm parity expectations differ from freshly generated ones."
            echo "Regenerate them with:"
            echo "  go run ./cmd/gencorpus"
            echo "and commit the result."
            exit 1
          fi
      - name: test
        run: go test -race -v -run TestAuthorizeEntryExpirationProperty ./...
      - name: test all
        run: go test -race ./...
      # The parity regression test lives in the e2e package, so the tag hides it
      # from `go test ./...`, but it needs no network: it reads the committed
      # report when a live one is absent (e2e/testdata/parity_regression.json).
      # Run here as a step of this job rather than as a job of its own, because
      # pull requests are capped at five checks. This is what makes a parity
      # regression fail the build instead of only a local run.
      - name: parity report regression
        run: go test -tags e2e -run TestParityReportRegression ./e2e
      # Markdown is normalised so a prose diff stays about content rather than
      # about re-wrapping, and the two diagrams in docs/diagrams are committed
      # render output that must not drift from their source. Both run as steps
      # of this job rather than as jobs of their own, because pull requests are
      # capped at the five checks ci.yml and security.yml report and a new PR
      # workflow would add a row. The pinned tools come from the root package-lock.json.
      - name: install documentation tooling
        run: npm ci
      - name: markdown is formatted
        run: npx prettier --check '**/*.md'
      - name: diagrams are up to date
        run: node docs/diagrams/render.mjs --check

  golden-drift:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # @stellar/stellar-sdk@17.1.0 declares engines node >=22.12.0.
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json

      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh node testdata/gen/package-lock.json

      # npm ci installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree, so the reference build cannot
      # drift without this step noticing.
      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci

      - name: regenerate the vectors
        working-directory: testdata/gen
        run: node gen.mjs

      # The passkey vectors have a different reference implementation
      # (smart-account-kit, for the signature shape @stellar/stellar-sdk does
      # not define) so they have their own generator. It installs from the same
      # lockfile as the step above, and writes under testdata/vectors, so the
      # diff below covers it too.
      - name: regenerate the passkey vectors
        working-directory: testdata/gen
        run: node gen-passkey.mjs

      # The vectors are generated, committed artefacts. If regenerating them
      # changes anything, then either someone edited a vector by hand or the
      # reference implementation moved, and in both cases the committed
      # evidence no longer says what it claims to.
      # The browser demo (#55) needs a browser, an authenticator and a passkey
      # wallet contract, none of which exist here, so it cannot run end to end
      # in CI. This runs its logic against the same pinned SDK the install step
      # above produced, which is what keeps the demo's SDK calls honest.
      - name: check the browser demo against the pinned sdk
        run: node examples/browser-passkey/app.test.mjs

      - name: fail if the committed vectors changed
        run: |
          if ! git diff --exit-code testdata/vectors testdata/frozen; then
            echo
            echo "The committed golden vectors differ from freshly generated ones, or"
            echo "regeneration touched the frozen cross-version set under testdata/frozen."
            echo "Vectors are never edited by hand. Regenerate them with:"
            echo "  cd testdata/gen && npm ci && node gen.mjs"
            echo "and commit the result, or investigate why the reference output moved."
            echo "The frozen set is never regenerated; see testdata/frozen/README.md."
            exit 1
          fi

  # Third of the three pull-request checks ci.yml reports. The fixture contracts
  # are Rust and the
  # Go jobs do not compile them, which is how a contract that had never built
  # reached main and broke the scheduled e2e run for five runs in a row.
  #
  # Build and unit-test in one job on purpose: pull requests are capped at five
  # checks, so this covers both rather than becoming two.
  contracts:
    name: contracts build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rust-toolchain.toml pins the channel and the wasm32v1-none target, so
      # rustup installs exactly what the contracts are built with.
      - name: show the pinned toolchain
        run: |
          rustc --version
          cargo --version
      - name: record tool versions
        run: bash "$GITHUB_WORKSPACE/.github/scripts/record-tool-versions.sh" rust e2e/contracts/Cargo.lock
      - name: cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            e2e/contracts/target
          key: contracts-${{ runner.os }}-${{ hashFiles('e2e/contracts/Cargo.lock') }}
          restore-keys: contracts-${{ runner.os }}-
      - name: cargo test
        run: cargo test --workspace --locked
      - name: build every contract to wasm
        run: cargo build --release --target wasm32v1-none --workspace --locked
