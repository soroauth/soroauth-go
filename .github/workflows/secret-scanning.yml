name: Secret Scanning

on:
  # Run on pull requests
  pull_request:
    branches: [main]
  # Run on schedule weekly
  schedule:
    - cron: '0 3 * * 0'
  # Run manually
  workflow_dispatch:

jobs:
  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          OSV_SCANNER_VERSION=v8.13.0
          ARCH=amd64
          curl -sLf "https://github.com/zricethezav/gitleaks/releases/download/${OSV_SCANNER_VERSION}/gitleaks_${OSV_SCANNER_VERSION}_linux_${ARCH}.tar.gz" -o /tmp/osv.tar.gz
          tar -xzf /tmp/osv.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks --version

      - name: Generate allowlist for deterministic test keys
        run: python3 /github/workspace/scripts/secret_scan_allowlist.py

      - name: Run gitleaks full history scan
        run: |
          gitleaks protect \
            --repo . \
            --config /tmp/gitleaks_allowlist.toml \
            --no-git \
            --verbose \
            --report-format sarif \
            --report-path /tmp/sarif-results.json || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: /tmp/sarif-results.json

      - name: Check for non-allowlisted secrets
        run: python3 /github/workspace/scripts/check_secret_scan.py

      - name: Report finding with commit and file
        if: failure()
        run: |
          echo "::error ::Secret scanning found committed credentials"
          echo "Check the SARIL output for details on commit and file location"