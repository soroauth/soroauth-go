name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-actions:
    name: Check Mutable Action References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify all actions are pinned by SHA
        run: |
          # Search workflow files for references that do not contain a commit SHA
          violations=$(grep -rn "uses:" .github/workflows/ | grep -v '^[[:space:]]*#' | grep -vE '@[0-9a-f]{40}' | grep -vE 'uses: \./' | grep -vE 'grep -rn' || true)
          # We allow # comments trailing the SHA.
          violations=$(grep -rn "uses:" .github/workflows/ | grep -v '^[[:space:]]*#' | grep -vE '@[0-9a-f]{40}' | grep -vE 'uses: \./' | grep -vE 'grep -rn' || true)
          if [ -n "$violations" ]; then
            echo "::error::Found action references not pinned to a 40-character commit SHA:"
            echo "$violations"
            exit 1
          fi
