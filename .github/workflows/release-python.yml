# Publish the soroauth Python package to PyPI.
#
# Only on a version tag. A commit that is not a tag never publishes: the
# `guard` job refuses to produce a wheel at all, and the `publish` job
# refuses the OIDC claim from a non-tag ref. The wheel built in CI is the
# one that goes to PyPI, so what consumers install is what the smoke-replay
# job proved against the golden vectors.
#
# Trusted publishing is configured on the PyPI side: project `soroauth` is
# linked to this repository's `release-python.yml` workflow under the
# `pypi` environment. No long-lived PyPI token is stored anywhere.
name: release-python

on:
  push:
    tags:
      - "v*"
  # workflow_dispatch exists for a dry run on a release candidate commit;
  # the dispatch path builds and smokes but does NOT publish, because the
  # publish job's guard refuses any ref whose type is not `tag`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: refuse to proceed off a version tag
    runs-on: ubuntu-latest
    steps:
      - name: enforce tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # workflow_dispatch is allowed to build + smoke; the publish job
          # guards itself separately.
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "dispatch run: build + smoke only, publish will be skipped"
            exit 0
          fi
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "refuse: this workflow only runs on a version tag, got ref_type=${REF_TYPE}" >&2
            exit 1
          fi
          case "${REF_NAME}" in
            v*) echo "ok: ${REF_NAME}" ;;
            *) echo "refuse: tag must start with v, got ${REF_NAME}" >&2; exit 1 ;;
          esac

  sdist:
    name: build sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install build
        run: python -m pip install build
      - name: build sdist
        working-directory: bindings/python
        run: python -m build --sdist --outdir dist
      - name: upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soroauth-sdist
          path: bindings/python/dist/*.tar.gz
          retention-days: 1

  wheels:
    name: build wheel (${{ matrix.target }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            audit: auditwheel
          - target: linux-arm64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            audit: auditwheel
          - target: darwin-amd64
            os: macos-13
            goos: darwin
            goarch: amd64
            audit: delocate
          - target: darwin-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            audit: delocate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Wheel contents are Python-version-agnostic (no C extension to
          # compile; cffi ABI mode just dlopens the bundled library), so
          # the wheel is built once per platform rather than once per
          # Python minor version.
          python-version: "3.12"
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go .
      - name: install wheel tooling
        run: python -m pip install wheel auditwheel delocate
      - name: build the wheel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: bash bindings/python/scripts/build_wheel.sh python
      - name: retag Linux wheel to manylinux
        if: matrix.audit == 'auditwheel'
        working-directory: bindings/python/dist
        run: |
          set -euo pipefail
          # auditwheel repair rewrites the wheel tag to a manylinux_*
          # value compatible with the symbols the embedded libsoroauth
          # actually uses. A failure here means the Go runtime pulled in
          # something newer than the policy allows, which is useful
          # information at release time.
          for whl in *.whl; do
            auditwheel show "$whl" || true
            auditwheel repair "$whl" --wheel-dir repaired
          done
          rm -f *.whl
          mv repaired/*.whl .
          rm -rf repaired
          ls -l
      - name: delocate macOS wheel
        if: matrix.audit == 'delocate'
        working-directory: bindings/python/dist
        run: |
          set -euo pipefail
          # delocate-wheel bundles the dylib references so an install on
          # a user's Mac finds libsoroauth without SOROAUTH_LIB pointing
          # at an rpath this job's builder happened to use.
          for whl in *.whl; do
            delocate-wheel --require-archs ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }} -v "$whl"
          done
          ls -l
      - name: upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soroauth-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 1

  smoke:
    name: install wheel and replay vectors (${{ matrix.target }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-amd64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soroauth-wheel-${{ matrix.target }}
          path: dist
      - name: install the built wheel in a clean venv and replay goldens
        run: |
          set -euo pipefail
          python -m venv .venv
          # shellcheck disable=SC1091
          if [ -f .venv/bin/activate ]; then . .venv/bin/activate; else . .venv/Scripts/activate; fi
          wheel="$(ls dist/*.whl | head -1)"
          python bindings/python/scripts/smoke_wheel.py --wheel "$wheel"

  publish:
    name: publish to PyPI
    needs: [sdist, wheels, smoke]
    runs-on: ubuntu-latest
    # Only on a version tag; a workflow_dispatch run stops short of
    # publish. The environment gate on the PyPI side is also configured
    # against this workflow + the `pypi` environment below.
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment:
      name: pypi
      url: https://pypi.org/project/soroauth/
    permissions:
      # Trusted publishing needs an OIDC token to exchange with PyPI.
      id-token: write
    steps:
      - name: refuse to publish from a non-tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "refuse: ref_type=${REF_TYPE}" >&2
            exit 1
          fi
          case "${REF_NAME}" in
            v*) echo "ok: ${REF_NAME}" ;;
            *) echo "refuse: tag must start with v, got ${REF_NAME}" >&2; exit 1 ;;
          esac
      - name: download sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soroauth-sdist
          path: dist
      - name: download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: soroauth-wheel-*
          merge-multiple: true
          path: dist
      - name: show what is about to be published
        run: ls -l dist
      - name: publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.13.0
        with:
          packages-dir: dist

  verify-published:
    name: install from PyPI and replay (${{ matrix.target }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-amd64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: wait for PyPI to serve the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/soroauth/${version}/json" >/dev/null 2>&1; then
              echo "PyPI serves soroauth==${version}"
              exit 0
            fi
            echo "attempt ${i}/30: PyPI does not serve ${version} yet, waiting 20s"
            sleep 20
          done
          echo "PyPI never served ${version}" >&2
          exit 1
      - name: install the published wheel and replay goldens
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python -m venv .venv
          # shellcheck disable=SC1091
          if [ -f .venv/bin/activate ]; then . .venv/bin/activate; else . .venv/Scripts/activate; fi
          python -m pip install "soroauth==${version}"
          # smoke_wheel.py without --wheel installs cffi then imports the
          # already-installed soroauth from PyPI.
          python bindings/python/scripts/smoke_wheel.py
