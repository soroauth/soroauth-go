# Python binding: PEP 561 marker + stubs type-check as expected.
#
# Advisory: it does not run on pull requests (only the two jobs the branch
# ruleset requires do). It runs on main when the Python binding changes,
# and on demand from the Actions tab. That mirrors ci-jvm.yml.
name: ci / python

on:
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      # A workflow's own definition is in its paths, so an edit to this file
      # re-runs it.
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: stubs are type-correct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Python 3.9 is the binding's stated minimum (see pyproject.toml),
      # so the suite runs on the floor rather than only the newest
      # release: a stub that only type-checks on 3.12 is a stub that
      # drops support for everything the `requires-python` says we take.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: install mypy and cffi
        # mypy is the checker the stubs are evidence against; cffi is a
        # runtime dependency of soroauth.ffi, and mypy walks the import
        # graph even when all it reads of that module is its public
        # surface. Installing it keeps mypy from emitting a resolution
        # error that is not about the stubs under test.
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy==1.13.0 cffi
      - name: install the soroauth package so its py.typed and .pyi land in site-packages
        working-directory: bindings/python
        run: |
          # No wheel build here: the stub check does not need the native
          # library, only the package metadata and the stub file beside
          # the module. `pip install .` runs the build backend, which
          # installs the package tree with py.typed and the .pyi.
          python -m pip install .
      - name: the package is marked typed and the stub is installed
        run: |
          python - <<'EOF'
          import importlib.util, pathlib, sys
          # PEP 561: a package with py.typed is a typed distribution.
          # A non-shipped marker is the usual regression (the wheel
          # built fine but package-data was left out), so check it from
          # the installed package's own file tree, not the source tree.
          # Do not `import soroauth` — its __init__.py dlopens the
          # native library at import time, and this job intentionally
          # does not build it.
          spec = importlib.util.find_spec("soroauth")
          if spec is None or spec.submodule_search_locations is None:
              print("soroauth is not installed", file=sys.stderr)
              sys.exit(1)
          root = pathlib.Path(next(iter(spec.submodule_search_locations)))
          for name in ("py.typed", "__init__.pyi"):
              p = root / name
              if not p.is_file():
                  print(f"missing from installed package: {p}", file=sys.stderr)
                  sys.exit(1)
              print(f"present: {p}")
          EOF
      - name: mypy accepts a well-typed sample and rejects a wrong one
        working-directory: bindings/python/typecheck
        run: bash check.sh
