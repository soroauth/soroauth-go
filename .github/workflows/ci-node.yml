# Node binding: builds the C ABI shared library and the N-API addon, then
# replays every golden vector through the Node API.
#
# The replay is the gate. A native binding that can disagree with the Go library
# is worse than none, so each runner builds its own platform's pair from source
# and checks the bytes the JS reference implementation recorded -- on every
# platform and Node line the published package claims, because "it works on the
# machine I was using" is not a claim about a published package.
#
# Two jobs here exist for the published package rather than the source tree:
#
#   source-fallback   removes prebuilds/ and proves `npm install` rebuilds the
#                     pair, asserting the fallback actually ran, so the path
#                     that keeps an unsupported platform working cannot rot
#                     unnoticed while CI only walks the prebuild path.
#   installed-package installs the packed tarball in a container with no Go
#                     toolchain and replays every vector through it, which is
#                     exactly what a consumer does.
#
# `workflow_call` exists so the release workflow runs this same definition on
# the tagged commit. A tag does not trigger this workflow otherwise, and a
# release must not ship binaries built from a different commit.
name: ci / node

on:
  # Advisory checks do not run on pull requests. Only the two jobs the branch
  # ruleset requires do, so a contributor sees two checks and not a wall of
  # them. These run when the change reaches main, and can be run by hand from
  # the Actions tab at any time.
  push:
    branches: [main]
    paths:
      - "bindings/node/**"
      - "bindings/c/**"
      - "testdata/vectors/**"
      - "testdata/gen/**"
      - "go.mod"
      - "go.sum"
      # A workflow's own definition is in its paths, so an edit to this file
      # re-runs it. Without this line a change to this workflow cannot validate
      # itself.
      - ".github/workflows/ci-node.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: node binding (${{ matrix.platform }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # The four platform pairs a release publishes. `platform` is the
        # prebuilds/ directory name, kept explicit so an artifact's name never
        # depends on how a hosted runner happens to spell its architecture.
        # macos-15-intel is the x64 macOS image and macos-15 the arm64 one.
        # Windows is not supported (see bindings/node/README.md).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
        node: ["22", "24"]
        include:
          - os: ubuntu-latest
            platform: linux-x64
            library: libsoroauth.so
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            library: libsoroauth.so
          - os: macos-15-intel
            platform: darwin-x64
            library: libsoroauth.dylib
          - os: macos-15
            platform: darwin-arm64
            library: libsoroauth.dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # The Go shared library and the addon are build output, never committed:
      # each runner builds its own platform's pair, so the replay is against a
      # binary that was just produced rather than a checked-in one.
      - name: build the binding
        working-directory: bindings/node
        run: |
          npm ci
          npm run build
      # A runner label that starts producing a different architecture would put
      # an arm64 pair in a directory named linux-x64, and every later check
      # would still pass by looking in the same wrong place. The layout is
      # asserted here, next to the build, and the binary's real format is
      # checked again before publish.
      - name: assert the pair landed under the platform it claims
        working-directory: bindings/node
        run: |
          set -euo pipefail
          test -f "prebuilds/${{ matrix.platform }}/soroauth.node"
          test -f "prebuilds/${{ matrix.platform }}/${{ matrix.library }}"
      - name: replay every golden vector through the node api
        working-directory: bindings/node
        run: npm test
      # One artifact per platform. The Node dimension produces the same pair
      # twice because N-API's ABI does not vary with the Node version. The
      # release workflow downloads these into the published tarball; nothing
      # here is committed.
      - name: upload the prebuilt pair
        if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-prebuild-${{ matrix.platform }}
          path: bindings/node/prebuilds/
          if-no-files-found: error

  source-fallback:
    name: node binding source-build fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # Exercise the branch install.mjs takes when no prebuild matches, which is
      # the only path a platform the release does not cover has. The log
      # assertion is the evidence: without it the job passes even if the script
      # quietly used a prebuild that happened to be there.
      - name: install with no prebuild present and assert the fallback ran
        working-directory: bindings/node
        run: |
          set -euo pipefail
          rm -rf prebuilds build
          test ! -d prebuilds
          npm ci 2>&1 | tee /tmp/install-fallback.log
          grep -F "no prebuilt binding for linux-x64; attempting a source build" /tmp/install-fallback.log
          test -f prebuilds/linux-x64/soroauth.node
          test -f prebuilds/linux-x64/libsoroauth.so
      # The negative control: with a prebuild in place the same command must take
      # the other branch and say so. Two runs that differ only in the prebuild's
      # presence prove the assertion above discriminates.
      - name: install with a prebuild present and assert the fallback did not run
        working-directory: bindings/node
        run: |
          set -euo pipefail
          npm ci > /tmp/install-prebuild.log 2>&1
          cat /tmp/install-prebuild.log
          grep -F "install: using the prebuilt binding for linux-x64" /tmp/install-prebuild.log
          if grep -F "attempting a source build" /tmp/install-prebuild.log; then
            echo "the prebuild was present but the install fell back to a source build" >&2
            exit 1
          fi
      - name: replay every golden vector through the source-built binding
        working-directory: bindings/node
        run: npm test

  installed-package:
    name: packed tarball installs with no go toolchain
    needs: node
    runs-on: ubuntu-latest
    # A container with no Go toolchain, because that is the install this change
    # exists to make work. Hiding Go on a hosted runner would prove the same
    # thing less directly.
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: download the four prebuilt pairs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-prebuild-*
          path: bindings/node/prebuilds
          merge-multiple: true
      - name: assert there is no go toolchain in this container
        run: |
          set -euo pipefail
          if command -v go >/dev/null 2>&1; then
            echo "this job is only meaningful without a Go toolchain, but $(command -v go) exists" >&2
            exit 1
          fi
      - name: verify the four-platform prebuild layout
        run: node bindings/node/scripts/verify-prebuilds.mjs bindings/node/prebuilds
      - name: pack the package and install it in a clean project
        working-directory: bindings/node
        run: |
          set -euo pipefail
          # Stage the license explicitly and pack with --ignore-scripts: npm 10
          # prints a lifecycle script's output before the JSON, which makes the
          # pack report unparseable. prepack does exactly this staging step.
          node scripts/stage-license.mjs
          npm pack --json --ignore-scripts > /tmp/pack.json
          node scripts/verify-prebuilds.mjs prebuilds --tarball /tmp/pack.json
          tarball="$PWD/$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/pack.json","utf8"))[0].filename')"
          mkdir -p /tmp/probe
          cd /tmp/probe
          npm init -y >/dev/null
          npm install "$tarball" --no-audit --no-fund
      - name: replay every golden vector through the installed package
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/bindings/node/scripts/smoke-installed.mjs" \
            --from /tmp/probe \
            --vectors "$GITHUB_WORKSPACE/testdata/vectors"
