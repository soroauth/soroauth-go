name: e2e

on:
  schedule:
    # Run every 6 hours. Testnet resets, protocol upgrades, and RPC
    # changes will break this silently between releases, so a manual
    # run is not enough.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: e2e scenarios on testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json

      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci

      - name: install stellar-cli
        run: |
          curl -sSfL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          stellar --version

      - name: build the modular-account fixture
        working-directory: e2e/contracts
        run: |
          stellar contract build
          test -f target/wasm32v1-none/release/modular_account.wasm

      - name: run e2e scenarios
        env:
          SOROAUTH_RPC_URL: ${{ secrets.SOROAUTH_RPC_URL }}
        run: |
          go test -tags e2e -v ./e2e/... 2>&1 | tee /tmp/e2e.out

      # e2e/RESULTS.md is written by a real run and only when every
      # scenario ran. It is a deliberate act, never an automatic commit.
      # The CI run surface is what matters; RESULTS.md is committed only
      # from a local run by a human who verified it.

      - name: create failure issue on regression
        if: failure() && github.event_name == 'schedule'
        run: |
          gh issue create \
            --repo soroauth/soroauth-go \
            --title "e2e regression detected on testnet" \
            --body "The scheduled e2e run failed. This is likely caused by a testnet reset, protocol upgrade, or RPC change.\n\nCheck the workflow run: https://github.com/soroauth/soroauth-go/actions/runs/${{github.run_id}}" \
            --label area:testing --label complexity:high || true
