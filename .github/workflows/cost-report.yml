name: CI cost report

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Listing workflow runs needs this. Without it the API returns 403 and the
  # report is silently empty rather than wrong-but-plausible.
  actions: read

jobs:
  report:
    name: Report CI cost per workflow
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CI cost data from GitHub API
        env:
          # The token is not an environment variable by default; the previous
          # version read ${GITHUB_TOKEN} under `set -u` and failed on the first
          # line every time it ran.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          since="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "counting runs started since ${since}"

          # gh paginates and gives the fields directly. The previous version
          # called the REST endpoint with curl and then read the response as if
          # it were an array: `jq length` on {total_count, workflow_runs: [...]}
          # returns 2, the number of keys, so the loop ran twice and read
          # .[0]/.[1], which are a number and an array. It also read
          # `duration_in_seconds`, which that endpoint does not return.
          gh run list --repo "${GITHUB_REPOSITORY}" --limit 1000 \
            --json workflowName,startedAt,updatedAt,conclusion \
            > runs.json

          jq -r --arg since "$since" '
            [ .[]
              | select(.startedAt >= $since)
              | select(.conclusion != null and .conclusion != "")
              | { name: .workflowName,
                  secs: (((.updatedAt | fromdateiso8601) - (.startedAt | fromdateiso8601))) }
              | select(.secs >= 0)
            ]
            | group_by(.name)
            | map({ name: .[0].name,
                    runs: length,
                    minutes: ((map(.secs) | add) / 60 | floor) })
            | sort_by(-.minutes)
            | .[]
            | "\(.minutes)\t\(.runs)\t\(.name)"
          ' runs.json > report.tsv

          total=$(awk -F'\t' '{s+=$1} END {print s+0}' report.tsv)

          {
            echo "## CI cost report"
            echo
            echo "Wall-clock duration of completed runs started in the last 30 days."
            echo "This is elapsed time per run, not billed runner minutes: a job on a"
            echo "larger runner or a matrix fanning out costs more than this shows."
            echo "It is for comparing workflows against each other, not for billing."
            echo
            echo "| workflow | runs | minutes |"
            echo "| --- | ---: | ---: |"
            while IFS=$'\t' read -r minutes runs name; do
              printf '| `%s` | %s | %s |\n' "$name" "$runs" "$minutes"
            done < report.tsv
            echo
            echo "**Total: ${total} minutes across $(wc -l < report.tsv | tr -d ' ') workflows.**"
          } >> "$GITHUB_STEP_SUMMARY"

          cat report.tsv
          echo "total minutes: ${total}"

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-cost-report
          path: .github/workflows/cost-report.yml
          retention-days: 30