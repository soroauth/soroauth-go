version: 2
updates:
  # Actions are pinned to full commit SHAs (see .github/workflows/*.yml) so a
  # compromised or retagged action cannot silently run with access to this
  # repository's CI. Dependabot understands that pin format for the
  # github-actions ecosystem: it opens a PR that updates both the SHA and the
  # trailing version comment together, so the two can never drift apart.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Go modules. The root module plus each adapter, because every nested go.mod
  # is its own module: Dependabot does not walk into one from the root, so an
  # omitted directory is an adapter whose dependencies are never updated. That
  # has already bitten this repository once — adapters/awskms pinned versions
  # that do not exist on any registry and nothing noticed.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
  - package-ecosystem: "gomod"
    directory: "/adapters/awskms"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
  - package-ecosystem: "gomod"
    directory: "/adapters/gcpkms"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
  - package-ecosystem: "gomod"
    directory: "/adapters/walletsdk"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # npm. Four separate projects, each with its own lockfile.
  #
  # testdata/gen is the one that matters most, and it is also the one where an
  # update must never land unreviewed: it pins @stellar/stellar-sdk exactly,
  # the generator refuses to run against any other version, and the vectors it
  # writes are what proves this library byte-for-byte. A bump there is a change
  # to the reference implementation, so it needs reading, regenerating and an
  # explanation — not a merge.
  # testdata/gen is deliberately NOT updated by Dependabot.
  #
  # It pins @stellar/stellar-sdk exactly, gen.mjs refuses to run against any
  # other version, and the vectors it writes are what proves this library
  # byte-for-byte. A bump is therefore a change to the reference implementation,
  # not a chore.
  #
  # This is not a precaution. #280 bumped it 17.1.0 -> 17.2.0 and was merged,
  # which left package.json at 17.2.0, gen.mjs still demanding 17.1.0, and the
  # vectors unregenerated:
  #
  #   refusing to generate vectors: @stellar/stellar-sdk is 17.2.0,
  #   this generator is pinned to 17.1.0
  #
  # The `golden vectors are reproducible` job — the correctness gate for the
  # whole library — failed on main until it was reverted.
  #
  # To move this pin on purpose: read what changed upstream, update
  # REQUIRED_SDK_VERSION in gen.mjs and package.json together, regenerate, and
  # explain every byte that moved in the commit body.
  - package-ecosystem: "npm"
    directory: "/testdata/gen"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "@stellar/stellar-sdk"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
  - package-ecosystem: "npm"
    directory: "/testdata/differential"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
  - package-ecosystem: "npm"
    directory: "/wasm/ts"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
