[mypy]
# Strict is the only setting that makes stubs do work. A non-strict run
# would accept the Any the pre-stubs world returned.
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
# The stubs ship beside the module (not in a stubs package), so mypy must
# look at the installed package's own files rather than using any
# typeshed fallback that would silently resolve to Any.
follow_imports = normal
