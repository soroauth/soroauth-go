# oapi-codegen configuration for the verification service client.
#
# The generated client is committed (client/client.gen.go) and regenerated by
# generate.sh. CI runs generate.sh and fails if the committed client differs, so
# a hand edit drifts nowhere.
package: client
output: client/client.gen.go
generate:
  models: true
  client: true
output-options:
  # Keep every generated type, even one the conformance test does not name, so
  # the committed client is a function of the spec alone.
  skip-prune: true
